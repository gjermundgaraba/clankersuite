packages:
  - apps/*
  - packages/*

catalogMode: prefer
saveExact: true

catalog:
  "@clanker-stuff/oxlint-config": 0.5.0
  "@codemirror/commands": 6.11.1
  "@codemirror/lang-markdown": 6.5.2
  "@codemirror/language": 6.13.1
  "@codemirror/merge": 6.12.3
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.15
  "@effect/platform-browser": 4.1.3
  "@effect/tsgo": 0.67.7
  "@effect/vitest": 4.1.3
  "@foldkit/markdown": 0.15.0
  "@foldkit/oxlint-plugin": 0.15.4
  "@foldkit/ui": 0.170.0
  "@foldkit/vite-plugin": 0.29.0
  "@lezer/common": 1.5.5
  "@lezer/markdown": 1.8.1
  "@terrazzo/cli": 2.10.0
  "@terrazzo/parser": 2.10.0
  "@terrazzo/plugin-css": 2.10.0
  "@types/node": 26.6.6
  diff: 9.0.0
  effect: 4.1.3
  foldkit: 0.170.0
  happy-dom: 21.0.4
  playwright: 1.64.1
  typescript: 7.0.2
  ultracite: 8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  vitest: 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - effect
  - "@effect/*"
  - "@clanker-stuff/*"
