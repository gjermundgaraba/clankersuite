packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@clanker-stuff/oxlint-config": 0.1.0
  "@effect/tsgo": 0.57.0
  "@types/node": 26.6.5
  typescript: 7.0.2
  ultracite: 8.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - effect
  - "@effect/*"
  - "@clanker-stuff/*"
